    <circle cx="600" cy="475" r="84"/>
    <circle cx="720" cy="510" r="76"/>
    <circle cx="535" cy="570" r="72"/>
    <circle cx="660" cy="575" r="76"/>
  </g>
  <g fill="#f9e4a9" opacity=".9">
    <circle cx="450" cy="476" r="9"/><circle cx="490" cy="518" r="7"/><circle cx="592" cy="445" r="9"/><circle cx="628" cy="495" r="7"/><circle cx="704" cy="486" r="8"/><circle cx="548" cy="552" r="7"/><circle cx="680" cy="557" r="8"/>
  </g>
  <text x="600" y="745" font-family="Georgia, serif" font-size="38" text-anchor="middle" fill="#71432e">Pindivantalu</text>
  <text x="600" y="790" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" letter-spacing="4" fill="#8f6247">PHOTO COMING SOON</text>
