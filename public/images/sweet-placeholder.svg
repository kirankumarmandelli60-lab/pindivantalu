<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Pindivantalu sweet image placeholder</title>
  <desc id="desc">A warm illustrated placeholder for a traditional sweet photograph that will be added later.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7ead3"/>
      <stop offset="1" stop-color="#dfb58b"/>
    </linearGradient>
    <radialGradient id="sweet" cx="40%" cy="28%" r="75%">
      <stop offset="0" stop-color="#f9d58b"/>
      <stop offset="1" stop-color="#ba6738"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#background)"/>
  <circle cx="180" cy="160" r="180" fill="#fff8eb" opacity=".3"/>
  <circle cx="1050" cy="790" r="250" fill="#a95035" opacity=".08"/>
  <ellipse cx="600" cy="610" rx="330" ry="72" fill="#75472d" opacity=".16"/>
  <ellipse cx="600" cy="570" rx="320" ry="95" fill="#fff7e9"/>
